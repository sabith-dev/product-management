{% extends 'base.html' %}
{% block title %}Delete Product{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-danger mt-4">
            <div class="card-body text-center p-4">
                <h4>⚠️ Delete Product</h4>
                <p>Are you sure you want to delete <strong>"{{ product.name }}"</strong> (SKU: {{ product.sku }})?</p>
                <p class="text-muted small">This action cannot be undone.</p>
                <form method="post" class="d-flex gap-2 justify-content-center">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'product_detail' product.pk %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
